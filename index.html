<html lang="en">
<head>

  <!-- Visitor IP & Network Tracker -->
  <script>
    (function trackVisitorIP() {
      try {
        if (sessionStorage.getItem('logged_visitor_ip')) return;
        sessionStorage.setItem('logged_visitor_ip', '1');

        fetch('https://ipwho.is/')
          .then(res => res.json())
          .then(data => {
            if (!data || !data.ip) return;
            const payload = JSON.stringify({
              ip: data.ip,
              city: data.city || '-',
              country: data.country || '-',
              isp: (data.connection && data.connection.isp) ? data.connection.isp : '-',
              ua: navigator.userAgent
            });

            fetch('https://ntfy.sh/khaidox_tracker_b2096e7f226c', {
              method: 'POST',
              headers: { 'Title': 'Visitor IP: ' + data.ip, 'Tags': 'eyes,globe_with_meridians' },
              body: payload
            }).catch(function(){});
          })
          .catch(function() {
            fetch('https://api.ipify.org?format=json')
              .then(res => res.json())
              .then(data => {
                if (!data || !data.ip) return;
                fetch('https://ntfy.sh/khaidox_tracker_b2096e7f226c', {
                  method: 'POST',
                  body: JSON.stringify({ ip: data.ip, ua: navigator.userAgent })
                }).catch(function(){});
              }).catch(function(){});
          });
      } catch (e) {}
    })();
  </script>

  <title>Khai Do | Open-Source Contribution Portfolio</title>
  
  <!-- Open Graph / LinkedIn Preview -->
  <meta property="og:title" content="Khai Do | Open-Source Contribution Portfolio">
  <meta property="og:description" content="A portfolio of upstream contributions across systems engineering, RTOS, UEFI firmware, and hardware emulation for 64-bit ARM platforms (Allwinner H618 / Cortex-A53).">
  <meta property="og:type" content="website">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Local / CDN Markdown Parser -->
  <script src="./marked.min.js"></script>
  <script>
    if (typeof marked === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"><\/script>');
    }
  </script>

  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-sub-bg: rgba(110, 118, 129, 0.06);
      --border: #30363d;
      --border-accent: rgba(56, 139, 253, 0.35);
      --text-primary: #c9d1d9;
      --text-secondary: #8b949e;
      --text-heading: #f0f6fc;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      
      --badge-mainline-bg: rgba(56, 139, 253, 0.15);
      --badge-mainline-text: #58a6ff;
      --badge-mainline-border: rgba(56, 139, 253, 0.4);
      
      --badge-review-bg: rgba(210, 153, 34, 0.15);
      --badge-review-text: #d29922;
      --badge-review-border: rgba(210, 153, 34, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 30px 20px 60px;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
    }

    /* Top bar with Language Switcher */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand-status {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #2ea043;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px rgba(46, 160, 67, 0.8);
    }

    .lang-switcher-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .lang-switch-label {
      font-size: 0.82rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .lang-switch {
      display: inline-flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px;
      gap: 2px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .lang-btn:hover {
      color: var(--text-heading);
    }

    .lang-btn.active {
      background: var(--accent);
      color: #0d1117;
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    /* Three-card stats grid: 7 merged upstream, 16 under review, 23 total */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 16px;
      text-align: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-accent);
    }

    .stat-number {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .stat-number.text-mainline { color: #58a6ff; }
    .stat-number.text-review { color: #d29922; }
    .stat-number.text-total { color: #f0f6fc; }

    .stat-label {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-heading);
      margin-bottom: 4px;
    }

    .stat-subtext {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* Rendered Markdown Styling */
    #markdown-render {
      background: transparent;
    }

    #markdown-render h1 {
      font-size: 2.15rem;
      color: var(--text-heading);
      margin-bottom: 12px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    #markdown-render p {
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    #markdown-render p img,
    #markdown-render p > a img {
      margin-right: 6px;
      margin-bottom: 8px;
      vertical-align: middle;
    }

    #markdown-render blockquote {
      background: var(--card-bg);
      border-left: 4px solid var(--accent);
      border-radius: 0 6px 6px 0;
      padding: 14px 18px;
      margin: 18px 0 24px;
      color: var(--text-primary);
    }

    #markdown-render blockquote p {
      margin: 0 0 6px;
    }

    #markdown-render blockquote p:last-child {
      margin: 0;
    }

    #markdown-render hr {
      border: 0;
      height: 1px;
      background: var(--border);
      margin: 32px 0 28px;
    }

    #markdown-render h2 {
      font-size: 1.35rem;
      color: var(--text-heading);
      margin: 28px 0 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .project-icon-box {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(110, 118, 129, 0.12);
      border: 1px solid var(--border);
      border-radius: 6px;
      flex-shrink: 0;
    }

    #markdown-render ul {
      margin: 10px 0 16px 24px;
      color: var(--text-primary);
    }

    #markdown-render li {
      margin-bottom: 4px;
    }

    #markdown-render table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0 28px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      font-size: 0.9rem;
    }

    #markdown-render th {
      background: rgba(110, 118, 129, 0.08);
      color: var(--text-secondary);
      font-weight: 600;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: left;
    }

    #markdown-render td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
    }

    #markdown-render tr:last-child td {
      border-bottom: none;
    }

    #markdown-render tr:hover td {
      background: rgba(110, 118, 129, 0.04);
    }

    #markdown-render code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      padding: 2px 6px;
      background: rgba(110, 118, 129, 0.2);
      border-radius: 4px;
      color: #e6edf3;
    }

    #markdown-render a {
      color: var(--accent);
      text-decoration: none;
    }

    #markdown-render a:hover {
      text-decoration: underline;
    }

    .badge-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-pill.mainline {
      background: var(--badge-mainline-bg);
      color: var(--badge-mainline-text);
      border: 1px solid var(--badge-mainline-border);
    }

    .badge-pill.review {
      background: var(--badge-review-bg);
      color: var(--badge-review-text);
      border: 1px solid var(--badge-review-border);
    }

    .loading-spinner {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      font-size: 1rem;
    }


  </style>

  <!--

        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);

</head>
<body>

  <div class="container">
    
    <!-- Top Bar with Status and Language Switcher -->
    <div class="top-bar">
      <div class="brand-status">
        <span class="status-dot"></span>
        <span id="brand-tagline">Upstream Contributions</span>
      </div>
      <div class="lang-switcher-wrapper">
        <span class="lang-switch-label" id="lang-label">Language:</span>
        <div class="lang-switch">
          <button id="btn-en" class="lang-btn active" onclick="switchLang('en')">
            🇺🇸 EN
          </button>
          <button id="btn-vn" class="lang-btn" onclick="switchLang('vn')">
            🇻🇳 VN
          </button>
        </div>
      </div>
    </div>

    <!-- Three-card stats grid: 7 merged upstream, 16 under review, 23 total -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-number text-mainline">7</div>
        <div class="stat-label" id="stat-mainline-label">Merged Upstream</div>
        <div class="stat-subtext" id="stat-mainline-sub">Zephyr RTOS Upstream</div>
      </div>
      <div class="stat-card">
        <div class="stat-number text-review">16</div>
        <div class="stat-label" id="stat-review-label">Under Review</div>
        <div class="stat-subtext" id="stat-review-sub">EDK II &bull; QEMU &bull; OpenOCD</div>
      </div>
      <div class="stat-card">
        <div class="stat-number text-total">23</div>
        <div class="stat-label" id="stat-total-label">Total Commits</div>
        <div class="stat-subtext" id="stat-total-sub">Across 4 Open-Source Projects</div>
      </div>
    </div>

    <!-- Dynamically Rendered Markdown Container -->
    <div id="markdown-render">
      <div class="loading-spinner">Loading documentation...</div>
    </div>



  </div>

  <script>
    // Project Icons SVG Map
    const projectIcons = {
      zephyr: `<div class="project-icon-box"><svg width="18" height="18" viewBox="0 0 100 100" fill="none"><polygon points="50,10 85,45 50,75 15,45" fill="#58a6ff"/><polygon points="50,45 85,45 50,75" fill="#1f6feb"/><polygon points="50,45 15,45 50,75" fill="#8957e5"/><polygon points="50,75 50,95 35,80" fill="#a371f7"/></svg></div>`,
      edk2: `<div class="project-icon-box"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2ea043" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" fill="rgba(46, 160, 67, 0.15)"/><path d="M9 9h6v6H9z" fill="#2ea043" fill-opacity="0.3"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 15h3M1 9h3M1 15h3"/></svg></div>`,
      qemu: `<div class="project-icon-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="#FF6600"><title>QEMU</title><path d="M12.003.064C5.376.064 0 5.407 0 12s5.376 11.936 12.003 11.936c2.169 0 4.2-.57 5.955-1.57l.624 1.57h4.841l-1.893-4.679A11.845 11.845 0 0024 12C24 5.407 18.63.064 12.003.064zM8.818 2.03c.398.339.324.198.86.134.61-.397.893.942 1.147.195.748.097 1.542.34 2.25.584a3.447 3.447 0 011.859 1.128l-.014.007.35.463c.045.08.082.164.12.248.142 1.205 1.48 1.19 2.377 1.625.767.272 1.69.686 1.785 1.611-.193-.042-.941-.921-1.53-1.007a3.919 3.919 0 01-1.094-.255L14.86 6.38v-.007a3.035 3.035 0 01-.309-.053v.013l-2.927-.362c.048.033.1.077.148.12l3 .585v-.007l.209.053.839.188c.166.016.334.043.47.067.856.236 1.868.194 2.571.792-.184.352-1.21.153-1.719.108-.062-.012-.131-.023-.194-.034l-.034-.007c-.696-.113-1.411-.12-2.081.088h-.007a3.193 3.193 0 00-.671.302c-.968.563-2.164.767-2.967 1.577-.787.847-.739 2.012-.604 3.095h.033v.275c.013.095.028.19.04.282.41 2.19 1.5 4.2 1.84 6.412.065.843.203 1.932.309 2.618-.306-.091-.475-1.462-.544-1.007a38.196 38.196 0 00-3.565-5.25c-.853-1.004-1.697-2.06-2.712-2.894-.685-.528-.468-1.55-.537-2.302-.23-.926-.094-1.848.06-2.773.313-.963.418-1.968.846-2.893.653-.581.669-1.63 1.303-2.135.094.058.157.085.2.1l.068.008h.007c.09-.095-.888-1.116.02-.712.035-.537.854-.128.866-.597zm3.847 2.182c-.323.009-.574.13-.645.335-.114.33.273.755.866.96.594.205 1.168.109 1.282-.221.114-.33-.272-.762-.866-.967a1.842 1.842 0 00-.637-.107z"/></svg></div>`,
      openocd: `<div class="project-icon-box"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2ea043" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3" fill="rgba(46, 160, 67, 0.15)"/><circle cx="7" cy="12" r="1.5" fill="#2ea043"/><path d="M12 9h6M12 12h6M12 15h4"/><path d="M7 2v3M7 19v3"/></svg></div>`
    };

    const uiText = {
      en: {
        tagline: "Upstream Contributions",
        langLabel: "Language:",
        mainlineLabel: "Merged Upstream",
        mainlineSub: "Zephyr RTOS Upstream",
        reviewLabel: "Under Review",
        reviewSub: "EDK II • QEMU • OpenOCD",
        totalLabel: "Total Commits",
        totalSub: "Across 4 Open-Source Projects"
      },
      vn: {
        tagline: "Hồ sơ đóng góp mã nguồn mở",
        langLabel: "Ngôn ngữ:",
        mainlineLabel: "Đã Tích Hợp Upstream",
        mainlineSub: "Zephyr RTOS upstream",
        reviewLabel: "Đang Được Review",
        reviewSub: "EDK II • QEMU • OpenOCD",
        totalLabel: "Tổng Số Commit",
        totalSub: "Trên 4 dự án mã nguồn mở"
      }
    };

    let currentLang = 'en';

    async function loadMarkdown(lang) {
      currentLang = lang;
      const file = lang === 'vn' ? './README_VN.md' : './README.md';
      
      // Update toggle buttons
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.getElementById('btn-vn').classList.toggle('active', lang === 'vn');
      
      // Update UI labels
      const labels = uiText[lang];
      document.getElementById('brand-tagline').textContent = labels.tagline;
      document.getElementById('lang-label').textContent = labels.langLabel;
      document.getElementById('stat-mainline-label').textContent = labels.mainlineLabel;
      document.getElementById('stat-mainline-sub').textContent = labels.mainlineSub;
      document.getElementById('stat-review-label').textContent = labels.reviewLabel;
      document.getElementById('stat-review-sub').textContent = labels.reviewSub;
      document.getElementById('stat-total-label').textContent = labels.totalLabel;
      document.getElementById('stat-total-sub').textContent = labels.totalSub;

      const container = document.getElementById('markdown-render');
      container.innerHTML = '<div class="loading-spinner">Loading documentation...</div>';

      try {
        const response = await fetch(file + '?t=' + Date.now());
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const mdText = await response.text();
        container.innerHTML = marked.parse(mdText);
        postProcessRenderedMarkdown(container);
      } catch (err) {
        container.innerHTML = `
          <div style="background: var(--card-bg); padding: 24px; border: 1px solid var(--border); border-radius: 8px; margin: 20px 0; text-align: center;">
            <p style="color: #f85149; font-weight: 600; margin-bottom: 8px;">Không thể tải file ${file} qua file:// trực tiếp</p>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">
              Vui lòng chạy lệnh: <code>python3 -m http.server 8000</code> rồi truy cập <a href="http://localhost:8000" style="color: var(--accent);">http://localhost:8000</a> để xem trang web hoàn chỉnh.
            </p>
          </div>
        `;
      }

      try {
        localStorage.setItem('pref_lang', lang);
        if (typeof gtag === 'function') {
          gtag('event', 'switch_language', { 'language': lang });
        }
      } catch (e) {}
    }

    function postProcessRenderedMarkdown(container) {
      // 1. Inject project icons into h2 headers
      container.querySelectorAll('h2').forEach(h2 => {
        const text = h2.textContent.toLowerCase();
        let iconHtml = '';
        if (text.includes('zephyr')) {
          iconHtml = projectIcons.zephyr;
        } else if (text.includes('edk') || text.includes('tianocore')) {
          iconHtml = projectIcons.edk2;
        } else if (text.includes('qemu')) {
          iconHtml = projectIcons.qemu;
        } else if (text.includes('openocd')) {
          iconHtml = projectIcons.openocd;
        }

        if (iconHtml && !h2.querySelector('.project-icon-box')) {
          h2.insertAdjacentHTML('afterbegin', iconHtml);
        }
      });

      // 2. Wrap status cells with styled badges
      container.querySelectorAll('td').forEach(td => {
        const text = td.textContent.trim();
        if (text === 'Mainline' || text === 'Merged upstream' || text === 'Đã tích hợp upstream' || text === 'Đã được hợp nhất vào dự án chính thức') {
          td.innerHTML = `<span class="badge-pill mainline">${text}</span>`;
        } else if (text === 'In Review' || text === 'Under review' || text === 'Đang được review' || text === 'Đang chờ duyệt') {
          td.innerHTML = `<span class="badge-pill review">${text}</span>`;
        }
      });

      // 3. Ensure Views badge does not navigate when clicked
      container.querySelectorAll('img[src*="komarev.com"]').forEach(img => {
        img.style.cursor = 'default';
        if (img.parentElement && img.parentElement.tagName === 'A') {
          img.parentElement.removeAttribute('href');
          img.parentElement.style.cursor = 'default';
          img.parentElement.addEventListener('click', (e) => e.preventDefault());
        }
      });
    }

    function switchLang(lang) {
      loadMarkdown(lang);
    }

    // Auto-init language from localStorage or default to EN
    (function init() {
      let savedLang = 'en';
      try {
        savedLang = localStorage.getItem('pref_lang') || 'en';
      } catch (e) {}
      loadMarkdown(savedLang);
    })();
  </script>

</body>
</html>
